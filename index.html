<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="사람의 불편을 발견하고 아이디어를 실제 서비스로 연결하는 포트폴리오" />
    <title>Portfolio | Planner · Educator · AI Builder</title>
    <script>
      try {
        var mode = localStorage.getItem("portfolio-theme-mode");
        var dark = mode ? mode === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        if (localStorage.getItem("portfolio-language") === "en") document.documentElement.lang = "en";
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
